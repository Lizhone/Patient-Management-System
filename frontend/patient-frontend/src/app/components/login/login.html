
<div class="login-page">

  <div class="login-card">

    <!-- Gentle Care Branding -->
    <div class="brand">
      <img
        src="images/gentle-care-logo.png"
        alt="Gentle Care Logo"
        class="brand-logo"
      />
       <h1 class="brand-name">Gentle Care</h1>

      <p class="brand-subtitle">Access your account</p>
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="onLogin()" #loginForm="ngForm">

      <div class="form-group">
        <label for="username">Email / Username</label>

        <div class="input-wrapper">
          <span class="input-icon">✉</span>
          <input
            type="text"
            id="username"
            name="username"
            [(ngModel)]="username"
            placeholder="Enter email or username"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <div class="input-wrapper">
          <span class="input-icon">▣</span>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter password"
            required
          />
        </div>
      </div>

      <!-- Remember Me -->
      <div class="form-options">

        <label class="remember-option">
          <input
            type="checkbox"
            name="rememberMe"
            [(ngModel)]="rememberMe"
          />
          <span>Remember me</span>
        </label>

        <a href="javascript:void(0)">Forgot password?</a>

      </div>
<!-- Login Button  -->
     <button
  type="submit"
  class="login-button"
  [disabled]="loginForm.invalid || isLoading"
>
  {{ isLoading ? 'Signing in...' : 'Login' }}
</button>
    </form>

    <!-- OR Divider -->
    <div class="divider">
      <span></span>
      <p>OR</p>
      <span></span>
    </div>

    <!-- New User -->
    <div class="new-user">

      <div class="admin-icon">♙</div>

      <div>
        <h4>New here?</h4>
        <p>Contact administrator for access</p>
      </div>

    </div>

  </div>

</div>
